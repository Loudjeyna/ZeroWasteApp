# ─────────────────────────────────────────────────────────────
# إعدادات Gradle لمشروع ZeroWaste
# ─────────────────────────────────────────────────────────────

# تفعيل Gradle Daemon (أسرع في البناء المتكرر)
org.gradle.daemon=true

# تفعيل البناء المتوازي (يستغل كل أنوية المعالج)
org.gradle.parallel=true

# تفعيل configure-on-demand (تسريع تكوين المشاريع)
org.gradle.configureondemand=true

# زيادة الذاكرة المخصصة لـ JVM (Compose يحتاج ذاككة كبيرة)
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# تفعيل Build Cache (يقلل وقت البناء 30-50%)
org.gradle.caching=true

# ── Kotlin ──
# تفعيل Kotlin Daemon
kotlin.daemon.enabled=true

# Buildconfig مطلوب لبعض المكتبات
#android.defaults.buildfeatures.buildconfig=true

# تفعيل non-transitive R class (أسرع وأقل استهلاكاً للذاكرة)
android.nonTransitiveRClass=true

# ── AndroidX ──
android.useAndroidX=true
android.nonFinalResIds=true

# ── Compose ──
# تفعيل live literals لتحسين تجربة المعاينة
android.compose.liveLiterals=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
